<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Health Tracker - 塩分・体重管理</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --primary: #0f766e;
      --primary-light: #ccfbf1;
      --secondary: #0284c7;
      --accent: #f59e0b;
      --danger: #ef4444;
      --danger-light: #fee2e2;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --border: #e2e8f0;
      --radius: 16px;
      --shadow: 0 4px 12px -2px rgba(15, 23, 42, 0.05), 0 2px 6px -1px rgba(15, 23, 42, 0.03);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro JP", "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); padding: 14px 12px 80px 12px; -webkit-tap-highlight-color: transparent; }
    .container { max-width: 480px; margin: 0 auto; }

    /* ナビゲーションバー */
    .date-nav {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--card-bg); border-radius: var(--radius); padding: 10px 14px;
      margin-bottom: 14px; box-shadow: var(--shadow);
    }
    .nav-btn {
      background: #f8fafc; border: 1px solid var(--border); color: var(--text-main);
      border-radius: 10px; padding: 8px 12px; font-size: 0.85rem; font-weight: 600; cursor: pointer;
    }
    .date-input {
      border: 1px solid var(--border); border-radius: 10px; padding: 6px 10px;
      font-size: 0.95rem; font-weight: 700; color: var(--text-main); background: #f8fafc;
    }

    /* 共通カード */
    .card {
      background: var(--card-bg); border-radius: var(--radius);
      padding: 18px 16px; margin-bottom: 14px; box-shadow: var(--shadow);
      border: 1px solid rgba(226, 232, 240, 0.6);
    }
    .card-title {
      font-size: 0.95rem; font-weight: 700; color: var(--text-main);
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;
      letter-spacing: -0.01em;
    }

    /* メーターカード */
    .meter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .meter-box {
      background: #f8fafc; border: 1px solid var(--border); border-radius: 12px;
      padding: 12px 14px; display: flex; flex-direction: column; justify-content: space-between;
    }
    .meter-label { font-size: 0.78rem; font-weight: 600; color: var(--text-sub); }
    .meter-val { font-size: 1.6rem; font-weight: 800; color: var(--primary); letter-spacing: -0.02em; margin: 4px 0; }
    .meter-val small { font-size: 0.85rem; font-weight: 600; color: var(--text-sub); }
    .bar-bg { width: 100%; height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden; }
    .bar-fill { height: 100%; width: 0%; background: var(--primary); transition: width 0.3s ease; }
    .bar-fill.danger { background: var(--danger); }
    .danger-text { color: var(--danger) !important; }

    /* カテゴリタブ */
    .category-selector { display: flex; gap: 6px; margin-bottom: 12px; }
    .cat-btn {
      flex: 1; padding: 9px 0; border: 1px solid var(--border); background: #f8fafc;
      border-radius: 10px; font-size: 0.85rem; font-weight: 600; color: var(--text-sub); cursor: pointer;
      transition: all 0.2s ease;
    }
    .cat-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 2px 6px rgba(15, 118, 110, 0.25); }

    /* フォームスタイル */
    .form-group { display: flex; gap: 8px; margin-bottom: 8px; }
    input, textarea {
      flex: 1; min-width: 0; padding: 11px 12px; border: 1px solid var(--border);
      border-radius: 10px; font-size: 0.95rem; background: #f8fafc; color: var(--text-main);
      -webkit-appearance: none;
    }
    input:focus, textarea:focus { outline: none; border-color: var(--primary); background: #fff; }
    button.btn-primary {
      padding: 10px 18px; border: none; border-radius: 10px; background: var(--primary);
      color: #fff; font-weight: 700; font-size: 0.9rem; cursor: pointer; white-space: nowrap;
    }
    button.calc-toggle {
      background: #f1f5f9; border: 1px solid var(--border); color: var(--text-sub);
      font-size: 0.78rem; font-weight: 600; padding: 5px 10px; border-radius: 8px; cursor: pointer;
    }

    /* 換算電卓 */
    .calc-box { background: #f8fafc; border: 1px solid var(--border); padding: 12px; border-radius: 12px; margin-bottom: 12px; font-size: 0.82rem; }
    .calc-box-row { display: flex; gap: 6px; align-items: center; margin-top: 6px; }

    /* 食事リスト表示 */
    .meal-section { margin-top: 14px; border-top: 1px solid #f1f5f9; padding-top: 10px; }
    .meal-section:first-child { border-top: none; margin-top: 4px; padding-top: 0; }
    .meal-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.88rem; font-weight: 700; margin-bottom: 6px; }
    .meal-badge { background: #e0f2fe; color: #0369a1; padding: 2px 8px; border-radius: 6px; font-size: 0.75rem; }
    .meal-subtotal { font-size: 0.78rem; color: var(--text-sub); font-weight: 500; }
    .meal-subtotal strong { color: var(--primary); }
    .item-list { list-style: none; }
    .item-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 10px; margin-bottom: 4px; background: #f8fafc; border-radius: 8px; font-size: 0.88rem;
    }
    .delete-btn { color: #94a3b8; background: none; border: none; padding: 4px 8px; font-size: 1.2rem; cursor: pointer; }
    .delete-btn:hover { color: var(--danger); }

    /* 体重ステータス */
    .weight-row { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 0.85rem; }
    .del-link { color: var(--danger); background: none; border: none; font-size: 0.8rem; cursor: pointer; padding: 0; }

    /* 日記・メモエリア */
    .memo-area { width: 100%; border-radius: 10px; resize: none; min-height: 65px; line-height: 1.4; padding: 10px; margin-bottom: 8px; }

    /* グラフ */
    .chart-container { position: relative; width: 100%; height: 200px; margin-top: 10px; }
    canvas { width: 100%; height: 100%; display: block; }
    .chart-tabs { display: flex; gap: 4px; }
    .chart-tab { background: #f1f5f9; color: var(--text-sub); border: none; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; cursor: pointer; }
    .chart-tab.active { background: var(--primary); color: #fff; }
    .legend-box { display: flex; gap: 14px; font-size: 0.75rem; color: var(--text-sub); margin-top: 8px; justify-content: center; }
    .legend-item { display: flex; align-items: center; gap: 4px; }
    .legend-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  </style>
</head>
<body>
  <div class="container">
    <!-- 日付ナビゲーション -->
    <div class="date-nav">
      <button class="nav-btn" type="button" onclick="changeDate(-1)">◀ 前日</button>
      <input type="date" id="currentDateInput" class="date-input" onchange="onDateSelect(this.value)">
      <button class="nav-btn" type="button" onclick="changeDate(1)">翌日 ▶</button>
    </div>

    <!-- メーターカード -->
    <div class="card">
      <div class="meter-grid">
        <div class="meter-box">
          <span class="meter-label">残り塩分</span>
          <div class="meter-val" id="remainSalt">6.00 <small>g</small></div>
          <div class="bar-bg"><div class="bar-fill" id="saltBar"></div></div>
          <div style="font-size:0.75rem; color:var(--text-sub); margin-top:6px;">摂取: <span id="usedSalt">0.00</span>g</div>
        </div>
        <div class="meter-box">
          <span class="meter-label">残りカロリー</span>
          <div class="meter-val" id="remainCal">2000 <small>kcal</small></div>
          <div class="bar-bg"><div class="bar-fill" id="calBar"></div></div>
          <div style="font-size:0.75rem; color:var(--text-sub); margin-top:6px;">摂取: <span id="usedCal">0</span>kcal</div>
        </div>
      </div>
    </div>

    <!-- 食事記録 -->
    <div class="card">
      <div class="card-title">
        <span>食事の記録</span>
        <button class="calc-toggle" type="button" onclick="toggleCalc()">換算電卓</button>
      </div>

      <div class="category-selector">
        <button type="button" class="cat-btn" id="cat-breakfast" onclick="selectCategory('breakfast')">朝食</button>
        <button type="button" class="cat-btn" id="cat-lunch" onclick="selectCategory('lunch')">昼食</button>
        <button type="button" class="cat-btn" id="cat-dinner" onclick="selectCategory('dinner')">夕食</button>
        <button type="button" class="cat-btn" id="cat-snack" onclick="selectCategory('snack')">間食</button>
      </div>

      <!-- 換算電卓 -->
      <div id="calcBox" class="calc-box" style="display: none;">
        <div style="font-weight:700; margin-bottom:4px;">100mlあたり／小分けの換算</div>
        <div class="calc-box-row">
          <input type="number" id="calcUnitVal" placeholder="表示値(g)" step="0.01" inputmode="decimal" oninput="runMiniCalc()">
          <span>×</span>
          <input type="number" id="calcTotalVolume" placeholder="総量(ml)" inputmode="numeric" oninput="runMiniCalc()">
          <span>÷</span>
          <input type="number" id="calcBaseVolume" value="100" style="max-width:55px;" inputmode="numeric" oninput="runMiniCalc()">
        </div>
        <div class="calc-box-row" style="justify-content: flex-end; margin-top: 8px;">
          <span id="calcResult" style="font-weight: bold; margin-right: 8px;">0.00g</span>
          <button class="calc-toggle" type="button" onclick="applyCalc()">塩分枠へ</button>
        </div>
      </div>

      <div class="form-group">
        <input type="text" id="foodName" placeholder="メニュー (例: 納豆ごはん)">
      </div>
      <div class="form-group">
        <input type="number" id="foodSalt" placeholder="塩分 (g)" step="0.01" inputmode="decimal">
        <input type="number" id="foodCal" placeholder="カロリー (kcal)" inputmode="numeric">
        <button type="button" class="btn-primary" onclick="addFood()">追加</button>
      </div>

      <div id="groupedFoodList"></div>
    </div>

    <!-- 朝の体重測定 -->
    <div class="card">
      <div class="card-title">朝の体重測定</div>
      <div class="form-group">
        <input type="number" id="weightVal" placeholder="体重 (kg)" step="0.1" inputmode="decimal">
        <button type="button" class="btn-primary" onclick="saveWeight()">保存</button>
      </div>
      <div class="weight-row">
        <span id="weightDisplay" style="color:var(--text-sub);">未記録</span>
        <button type="button" class="del-link" id="textDeleteBtn" onclick="clearWeight()" style="display:none;">記録を取り消す</button>
      </div>
    </div>

    <!-- 一言日記・メモ -->
    <div class="card">
      <div class="card-title">一言日記・体調メモ</div>
      <textarea id="dailyMemo" class="memo-area" placeholder="体調の変化やメモ（例: 外食で少し塩分多め。むくみなし。散歩40分など）"></textarea>
      <div style="display: flex; justify-content: flex-end;">
        <button type="button" class="btn-primary" style="padding: 7px 16px; font-size: 0.85rem;" onclick="saveMemo()">メモを保存</button>
      </div>
    </div>

    <!-- 直近7日間の推移グラフ -->
    <div class="card">
      <div class="card-title">
        <span>直近7日間の推移</span>
        <div class="chart-tabs">
          <button class="chart-tab active" id="tabBoth" onclick="setChartMode('both')">両方</button>
          <button class="chart-tab" id="tabSalt" onclick="setChartMode('salt')">塩分</button>
          <button class="chart-tab" id="tabWeight" onclick="setChartMode('weight')">体重</button>
        </div>
      </div>
      <div class="chart-container">
        <canvas id="healthChart"></canvas>
      </div>
      <div class="legend-box">
        <span class="legend-item"><span class="legend-dot" style="background:var(--secondary);"></span>塩分(g)</span>
        <span class="legend-item"><span class="legend-dot" style="background:var(--primary);"></span>体重(kg)</span>
        <span class="legend-item" style="color:var(--danger);"><span style="border-bottom:1px dashed var(--danger); width:12px; display:inline-block; margin-right:3px;"></span>目標6g</span>
      </div>
    </div>
  </div>

  <script>
    const MAX_SALT = 6.0;
    const MAX_CAL = 2000;
    let chartMode = 'both';

    let currentCategory = getDefaultCategory();

    function getDefaultCategory() {
      const hour = new Date().getHours();
      if (hour < 10) return 'breakfast';
      if (hour < 15) return 'lunch';
      if (hour < 21) return 'dinner';
      return 'snack';
    }

    function selectCategory(cat) {
      currentCategory = cat;
      ['breakfast', 'lunch', 'dinner', 'snack'].forEach(c => {
        const btn = document.getElementById(`cat-${c}`);
        if (c === cat) btn.classList.add('active');
        else btn.classList.remove('active');
      });
    }

    let activeDate = formatDate(new Date());

    function formatDate(d) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    let data = JSON.parse(localStorage.getItem('heartHealthData')) || {};

    function ensureDateData(targetDate) {
      if (!data[targetDate]) {
        data[targetDate] = { foods: [], weight: null, memo: '' };
      }
    }

    const CATEGORIES = [
      { key: 'breakfast', label: '朝食' },
      { key: 'lunch', label: '昼食' },
      { key: 'dinner', label: '夕食' },
      { key: 'snack', label: '間食' }
    ];

    function render() {
      ensureDateData(activeDate);
      document.getElementById('currentDateInput').value = activeDate;
      selectCategory(currentCategory);

      const dayData = data[activeDate];
      const totalSalt = dayData.foods.reduce((sum, f) => sum + (parseFloat(f.salt) || 0), 0);
      const totalCal = dayData.foods.reduce((sum, f) => sum + (parseInt(f.cal) || 0), 0);

      const remainSalt = Math.max(0, MAX_SALT - totalSalt);
      const remainCal = Math.max(0, MAX_CAL - totalCal);

      document.getElementById('usedSalt').innerText = totalSalt.toFixed(2);
      document.getElementById('usedCal').innerText = totalCal;
      
      const saltElem = document.getElementById('remainSalt');
      saltElem.innerHTML = remainSalt.toFixed(2) + ' <small>g</small>';
      if (totalSalt >= MAX_SALT) saltElem.classList.add('danger-text');
      else saltElem.classList.remove('danger-text');

      document.getElementById('remainCal').innerHTML = remainCal + ' <small>kcal</small>';

      // メーターゲージ
      const saltPercent = Math.min(100, (totalSalt / MAX_SALT) * 100);
      const saltBar = document.getElementById('saltBar');
      saltBar.style.width = saltPercent + '%';
      saltBar.className = 'bar-fill' + (saltPercent >= 100 ? ' danger' : '');

      const calPercent = Math.min(100, (totalCal / MAX_CAL) * 100);
      document.getElementById('calBar').style.width = calPercent + '%';

      // 食事リスト
      const container = document.getElementById('groupedFoodList');
      container.innerHTML = '';
      let hasAnyFood = false;

      CATEGORIES.forEach(cat => {
        const itemsWithIndex = dayData.foods
          .map((item, originalIndex) => ({ item, originalIndex }))
          .filter(({ item }) => (item.category ? item.category === cat.key : cat.key === 'lunch'));

        if (itemsWithIndex.length > 0) {
          hasAnyFood = true;
          const subSalt = itemsWithIndex.reduce((s, { item }) => s + (parseFloat(item.salt) || 0), 0);
          const subCal = itemsWithIndex.reduce((s, { item }) => s + (parseInt(item.cal) || 0), 0);

          const sec = document.createElement('div');
          sec.className = 'meal-section';
          sec.innerHTML = `
            <div class="meal-header">
              <span class="meal-badge">${cat.label}</span>
              <span class="meal-subtotal">計: <strong>${subSalt.toFixed(2)}g</strong> / ${subCal}kcal</span>
            </div>
            <ul class="item-list"></ul>
          `;

          const ul = sec.querySelector('ul');
          itemsWithIndex.forEach(({ item, originalIndex }) => {
            const li = document.createElement('li');
            li.className = 'item-row';
            li.innerHTML = `
              <span>${item.name} <strong style="color:var(--text-sub); font-size:0.8rem;">(${item.salt}g / ${item.cal}kcal)</strong></span>
              <button class="delete-btn" type="button" onclick="removeFood(${originalIndex})">×</button>
            `;
            ul.appendChild(li);
          });
          container.appendChild(sec);
        }
      });

      if (!hasAnyFood) {
        container.innerHTML = '<div style="font-size:0.85rem; color:var(--text-sub); text-align:center; padding:12px 0;">まだ食事の記録はありません</div>';
      }

      // 体重
      const weightDisplay = document.getElementById('weightDisplay');
      const textDelBtn = document.getElementById('textDeleteBtn');
      if (dayData.weight) {
        weightDisplay.innerHTML = `記録済み: <strong style="color:var(--text-main); font-size:1.05rem;">${dayData.weight} kg</strong>`;
        textDelBtn.style.display = 'inline';
      } else {
        weightDisplay.innerText = '未記録（起床後トイレの後に測定）';
        textDelBtn.style.display = 'none';
      }

      // メモ・日記
      document.getElementById('dailyMemo').value = dayData.memo || '';

      localStorage.setItem('heartHealthData', JSON.stringify(data));
      drawChart();
    }

    function changeDate(offset) {
      const parts = activeDate.split('-');
      const d = new Date(parts[0], parts[1] - 1, parts[2]);
      d.setDate(d.getDate() + offset);
      activeDate = formatDate(d);
      render();
    }

    function onDateSelect(selected) {
      if (selected) {
        activeDate = selected;
        render();
      }
    }

    function addFood() {
      ensureDateData(activeDate);
      const name = document.getElementById('foodName').value.trim() || '食事';
      const salt = parseFloat(document.getElementById('foodSalt').value) || 0;
      const cal = parseInt(document.getElementById('foodCal').value) || 0;

      data[activeDate].foods.push({ name, salt, cal, category: currentCategory });
      document.getElementById('foodName').value = '';
      document.getElementById('foodSalt').value = '';
      document.getElementById('foodCal').value = '';
      render();
    }

    function removeFood(index) {
      ensureDateData(activeDate);
      data[activeDate].foods.splice(index, 1);
      render();
    }

    function saveWeight() {
      ensureDateData(activeDate);
      const val = parseFloat(document.getElementById('weightVal').value);
      if (!isNaN(val) && val > 0) {
        data[activeDate].weight = val;
        document.getElementById('weightVal').value = '';
        render();
      }
    }

    function clearWeight() {
      ensureDateData(activeDate);
      if (confirm('この日の体重記録を消去しますか？')) {
        data[activeDate].weight = null;
        document.getElementById('weightVal').value = '';
        render();
      }
    }

    function saveMemo() {
      ensureDateData(activeDate);
      data[activeDate].memo = document.getElementById('dailyMemo').value;
      localStorage.setItem('heartHealthData', JSON.stringify(data));
      alert('メモを保存しました！');
    }

    function toggleCalc() {
      const box = document.getElementById('calcBox');
      box.style.display = box.style.display === 'none' ? 'block' : 'none';
    }

    function runMiniCalc() {
      const val = parseFloat(document.getElementById('calcUnitVal').value) || 0;
      const totalVol = parseFloat(document.getElementById('calcTotalVolume').value) || 0;
      const baseVol = parseFloat(document.getElementById('calcBaseVolume').value) || 100;
      const result = (val * (totalVol / baseVol)).toFixed(2);
      document.getElementById('calcResult').innerText = `${result}g`;
      return result;
    }

    function applyCalc() {
      const result = runMiniCalc();
      document.getElementById('foodSalt').value = result;
      document.getElementById('calcBox').style.display = 'none';
    }

    function setChartMode(mode) {
      chartMode = mode;
      ['Both', 'Salt', 'Weight'].forEach(m => {
        document.getElementById('tab' + m).className = 'chart-tab' + (mode.toLowerCase() === m.toLowerCase() ? ' active' : '');
      });
      drawChart();
    }

    function drawChart() {
      const canvas = document.getElementById('healthChart');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);

      const w = rect.width;
      const h = rect.height;
      const padLeft = 32;
      const padRight = 32;
      const padTop = 20;
      const padBottom = 26;

      ctx.clearRect(0, 0, w, h);

      const dates = [];
      const parts = activeDate.split('-');
      for (let i = 6; i >= 0; i--) {
        const d = new Date(parts[0], parts[1] - 1, parts[2]);
        d.setDate(d.getDate() - i);
        dates.push(formatDate(d));
      }

      const salts = [];
      const weights = [];
      dates.forEach(d => {
        const day = data[d];
        const s = day ? day.foods.reduce((sum, f) => sum + (parseFloat(f.salt) || 0), 0) : 0;
        salts.push(s);
        weights.push(day && day.weight ? parseFloat(day.weight) : null);
      });

      const plotW = w - padLeft - padRight;
      const plotH = h - padTop - padBottom;
      const stepX = plotW / 6;

      ctx.fillStyle = '#94a3b8';
      ctx.font = '10px sans-serif';
      ctx.textAlign = 'center';
      dates.forEach((d, idx) => {
        const x = padLeft + idx * stepX;
        const mmdd = d.slice(5).replace('-', '/');
        ctx.fillText(mmdd, x, h - 8);
      });

      if (chartMode === 'both' || chartMode === 'salt') {
        const maxSaltRange = 10.0;
        const y6g = padTop + plotH - (6.0 / maxSaltRange) * plotH;
        ctx.strokeStyle = '#fca5a5';
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(padLeft, y6g);
        ctx.lineTo(w - padRight, y6g);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      if (chartMode === 'both' || chartMode === 'salt') {
        const maxSalt = 10.0;
        ctx.strokeStyle = '#0284c7';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        salts.forEach((val, idx) => {
          const x = padLeft + idx * stepX;
          const y = padTop + plotH - (Math.min(val, maxSalt) / maxSalt) * plotH;
          if (idx === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.stroke();

        salts.forEach((val, idx) => {
          const x = padLeft + idx * stepX;
          const y = padTop + plotH - (Math.min(val, maxSalt) / maxSalt) * plotH;
          ctx.fillStyle = val >= MAX_SALT ? '#ef4444' : '#0284c7';
          ctx.beginPath();
          ctx.arc(x, y, 4, 0, Math.PI * 2);
          ctx.fill();

          if (val > 0) {
            ctx.fillStyle = '#0f172a';
            ctx.font = 'bold 9px sans-serif';
            ctx.fillText(val.toFixed(1), x, y - 7);
          }
        });
      }

      if (chartMode === 'both' || chartMode === 'weight') {
        const validWeights = weights.filter(v => v !== null);
        if (validWeights.length > 0) {
          const minW = Math.floor(Math.min(...validWeights) - 1);
          const maxW = Math.ceil(Math.max(...validWeights) + 1);
          const rangeW = Math.max(2, maxW - minW);

          ctx.strokeStyle = '#0f766e';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          let started = false;
          weights.forEach((val, idx) => {
            if (val === null) return;
            const x = padLeft + idx * stepX;
            const y = padTop + plotH - ((val - minW) / rangeW) * plotH;
            if (!started) { ctx.moveTo(x, y); started = true; }
            else { ctx.lineTo(x, y); }
          });
          ctx.stroke();

          weights.forEach((val, idx) => {
            if (val === null) return;
            const x = padLeft + idx * stepX;
            const y = padTop + plotH - ((val - minW) / rangeW) * plotH;
            ctx.fillStyle = '#0f766e';
            ctx.beginPath();
            ctx.arc(x, y, 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#0f766e';
            ctx.font = 'bold 9px sans-serif';
            ctx.fillText(val.toFixed(1), x, y + 14);
          });
        }
      }
    }

    window.addEventListener('resize', drawChart);
    render();
  </script>
</body>
</html>
